<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mailtick - Smart Inbox</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        body {
            background: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none; 
            margin: 0;
            overflow: hidden;
        }
        
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Smooth Page Transition */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease forwards; }

        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .slide-in-right { animation: slideInRight 0.3s ease-out forwards; }

        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Clean links in email view */
        .email-body-text a { color: #60a5fa; text-decoration: underline; word-break: break-all; }
    </style>
</head>
<body class="h-screen w-full flex justify-center bg-gray-950" oncontextmenu="return false;">

    <!-- Main Container -->
    <div class="w-full max-w-3xl h-full relative flex flex-col shadow-2xl overflow-hidden bg-gray-900 border-x border-gray-800">

        <!-- ================= LOGIN SCREEN ================= -->
        <div id="login-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center p-6 bg-gray-900 transition-opacity duration-500">
            <div class="text-6xl text-blue-500 mb-6"><i class="fa-solid fa-envelope-open-text"></i></div>
            <h1 class="text-5xl font-bold mb-3 tracking-tight">Mailtick</h1>
            <p class="text-gray-400 text-center mb-10 text-lg">Smart AI-powered email management.</p>
            <button id="btn-login" class="w-full max-w-xs bg-white text-gray-900 font-bold py-3.5 px-4 rounded-xl shadow-lg flex items-center justify-center gap-3 active:scale-95 transition-transform">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-6 h-6" alt="Google">
                Login with Gmail
            </button>
        </div>

        <!-- ================= MAIN APP SCREEN ================= -->
        <div id="app-screen" class="hidden flex-col h-full w-full relative">
            
            <!-- Header -->
            <header class="pt-10 pb-4 px-6 glass flex justify-between items-center z-10 sticky top-0 border-b border-gray-800">
                <div class="flex-1 min-w-0 pr-4">
                    <h2 class="text-3xl font-bold tracking-wide flex items-center gap-3 truncate" id="header-title">
                        Inbox
                    </h2>
                    <p class="text-sm text-blue-400 font-medium mt-1 truncate" id="user-email-display">Loading...</p>
                </div>
                <button id="btn-sync" class="w-12 h-12 flex-shrink-0 rounded-full bg-blue-600/20 text-blue-400 flex items-center justify-center text-xl active:scale-90 transition-transform">
                    <i class="fa-solid fa-rotate"></i>
                </button>
            </header>

            <div id="sync-indicator" class="hidden absolute top-28 left-1/2 transform -translate-x-1/2 bg-blue-600 text-white text-sm px-5 py-2 rounded-full shadow-lg z-20 items-center gap-3">
                <div class="loader"></div> Syncing Emails...
            </div>

            <!-- Email List Content -->
            <main id="email-list" class="flex-1 overflow-y-auto hide-scrollbar p-4 md:p-6 space-y-4 pb-28">
                <!-- Emails/Folders injected here -->
            </main>

            <!-- Bottom Navigation -->
            <nav class="absolute bottom-0 w-full glass pb-6 pt-3 px-2 md:px-10 flex justify-around items-center z-20 border-t border-gray-800">
                <button class="nav-btn text-blue-400 flex flex-col items-center gap-1 w-16" data-tab="inbox">
                    <i class="fa-solid fa-inbox text-2xl"></i>
                    <span class="text-[10px] font-semibold mt-1">Inbox</span>
                </button>
                <button class="nav-btn text-gray-400 flex flex-col items-center gap-1 w-16" data-tab="important">
                    <i class="fa-solid fa-star text-2xl"></i>
                    <span class="text-[10px] font-semibold mt-1">Important</span>
                </button>
                <button class="nav-btn text-gray-400 flex flex-col items-center gap-1 w-16" data-tab="folders">
                    <i class="fa-solid fa-folder-open text-2xl"></i>
                    <span class="text-[10px] font-semibold mt-1">Folders</span>
                </button>
                <button class="nav-btn text-gray-400 flex flex-col items-center gap-1 w-16" data-tab="spam">
                    <i class="fa-solid fa-shield-virus text-2xl"></i>
                    <span class="text-[10px] font-semibold mt-1">Fraud</span>
                </button>
            </nav>
        </div>

        <!-- ================= FULL EMAIL VIEW ================= -->
        <div id="full-email-view" class="hidden absolute inset-0 z-40 bg-gray-900 flex-col slide-in-right">
            <header class="pt-10 pb-4 px-4 glass flex items-center gap-4 sticky top-0 border-b border-gray-800 z-10">
                <button id="btn-close-email" class="w-10 h-10 rounded-full bg-white/10 text-white flex items-center justify-center text-xl active:scale-90 flex-shrink-0">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <h2 class="text-xl font-bold truncate flex-1">Email View</h2>
            </header>
            <div class="flex-1 overflow-y-auto hide-scrollbar p-5 md:p-8 select-text">
                <h1 id="fv-subject" class="text-2xl font-bold mb-5 text-white leading-snug break-words">Subject</h1>
                <div class="flex justify-between items-start mb-6 pb-6 border-b border-gray-800">
                    <div class="flex-1 min-w-0 pr-4">
                        <div id="fv-sender-name" class="font-bold text-gray-200 text-lg truncate">Sender Name</div>
                        <div id="fv-sender-email" class="text-sm text-blue-400 mt-1 truncate">sender@email.com</div>
                    </div>
                    <div id="fv-date" class="text-xs text-gray-500 text-right mt-1 flex-shrink-0 whitespace-nowrap">Date</div>
                </div>
                <div id="fv-body" class="text-gray-300 text-base leading-relaxed whitespace-pre-wrap break-words email-body-text">
                    Body content...
                </div>
            </div>
        </div>

        <!-- ================= MODALS ================= -->
        
        <!-- AI Summary Modal -->
        <div id="summary-modal" class="hidden absolute inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-end justify-center">
            <div class="glass w-full h-[70%] rounded-t-3xl p-6 flex flex-col transform translate-y-full transition-transform duration-300" id="summary-content-box">
                <div class="flex justify-between items-center mb-4 border-b border-gray-600 pb-3">
                    <h3 class="text-xl font-bold flex items-center gap-2 text-blue-400">
                        <i class="fa-solid fa-sparkles"></i> AI Summary 
                        <span id="ai-model-badge" class="text-[10px] bg-blue-600/30 text-blue-300 px-2 py-0.5 rounded-full font-mono">Loading...</span>
                    </h3>
                    <button id="btn-close-summary" class="text-gray-400 hover:text-white text-3xl p-2 leading-none">&times;</button>
                </div>
                <div id="ai-typing-area" class="text-gray-200 leading-relaxed overflow-y-auto flex-1 text-base pr-2 select-text">
                </div>
            </div>
        </div>

        <!-- Action Modal -->
        <div id="action-modal" class="hidden absolute inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center px-6">
            <div class="glass w-full max-w-sm rounded-2xl p-4 flex flex-col gap-2 scale-90 opacity-0 transition-all duration-300" id="action-box">
                <h4 class="text-center text-gray-400 text-xs uppercase tracking-wider mb-2">Email Actions</h4>
                <button class="action-btn bg-white/10 p-3.5 rounded-lg text-left text-white flex items-center gap-3 active:bg-white/20" data-action="mark">
                    <i class="fa-solid fa-thumbtack text-blue-400 w-5 text-center"></i> Pin / Unpin Sender
                </button>
                <button class="action-btn bg-white/10 p-3.5 rounded-lg text-left text-white flex items-center gap-3 active:bg-white/20" data-action="category">
                    <i class="fa-solid fa-folder-plus text-green-400 w-5 text-center"></i> Add to Category
                </button>
                <button class="action-btn bg-white/10 p-3.5 rounded-lg text-left text-orange-400 flex items-center gap-3 active:bg-white/20" data-action="fraud">
                    <i class="fa-solid fa-triangle-exclamation w-5 text-center"></i> Mark as Fraud
                </button>
                <button class="action-btn bg-white/10 p-3.5 rounded-lg text-left text-red-400 flex items-center gap-3 active:bg-white/20" data-action="delete">
                    <i class="fa-solid fa-trash w-5 text-center"></i> Delete Permanently
                </button>
                <button id="btn-close-actions" class="mt-3 p-3 text-center text-gray-400 font-bold active:text-white border-t border-gray-700">Cancel</button>
            </div>
        </div>

    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, query, orderBy, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // ================= CONFIGURATION =================
        const GOOGLE_CLIENT_ID = "30172584711-9l229pscpqpf478qvtp2ronplmbrtha0.apps.googleusercontent.com"; 
        
        // ✨ DUAL AI KEYS ADDED FROM YOUR REFERENCE CODE ✨
        const PRIMARY_GEMINI_API_KEY = "AIzaSyDQlnzpsQ7GZG8zUlRRCSL_HzZ-Woi63pQ"; 
        const FALLBACK_GEMINI_API_KEY = "AIzaSyCKgmai2NXGMeQjF0_0xmRUcxsaTpGdTV4"; 

        const firebaseConfig = {
            apiKey: "AIzaSyDPVa0eYZpxYh6Q5vyhSf0IogTkedc72tE",
            authDomain: "mailtick-35818.firebaseapp.com",
            projectId: "mailtick-35818",
            storageBucket: "mailtick-35818.firebasestorage.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ================= STATE =================
        let accessToken = null;
        let currentUser = null;
        let currentTab = 'inbox'; 
        let allEmails = [];
        let spamKeywords = ['free offer', 'free gift', 'prize', 'urgent', 'winner', 'lottery', 'viagra', 'earn money fast', 'crypto', 'giveaway', 'claim now', 'cash prize', 'jackpot', 'bank alert', 'account suspended'];
        let markedSenders = [];
        let customCategoriesMap = {}; 
        let companyDomains = ['amazon', 'paypal', 'netflix', 'bank', 'apple', 'google', 'microsoft'];
        let longPressTimer;
        let selectedEmailId = null;
        let isScrolling = false; 

        // ================= GOOGLE AUTHENTICATION =================
        let tokenClient;
        window.onload = () => {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: GOOGLE_CLIENT_ID,
                scope: 'https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/gmail.readonly',
                callback: handleCredentialResponse,
            });
            document.getElementById("btn-login").addEventListener("click", () => tokenClient.requestAccessToken());
        };

        async function handleCredentialResponse(response) {
            if (response && response.access_token) {
                accessToken = response.access_token;
                try {
                    const profileRes = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: `Bearer ${accessToken}` } });
                    const profile = await profileRes.json();
                    currentUser = { email: profile.email };
                    document.getElementById('user-email-display').innerText = currentUser.email;
                    
                    document.getElementById('login-screen').classList.add('opacity-0', 'pointer-events-none');
                    setTimeout(() => {
                        document.getElementById('login-screen').classList.add('hidden');
                        document.getElementById('app-screen').classList.remove('hidden');
                        document.getElementById('app-screen').classList.add('flex');
                        initApp();
                    }, 500);
                } catch(e) { alert("Login failed."); }
            }
        }

        async function initApp() {
            await loadUserSettings();
            await loadEmailsFromFirestore();
            syncGmail(); 
        }

        async function loadUserSettings() {
            try {
                const markRef = doc(db, "users", currentUser.email, "settings", "marked_senders");
                const markSnap = await getDoc(markRef);
                if (markSnap.exists() && markSnap.data().senders) markedSenders = markSnap.data().senders;

                const catRef = doc(db, "users", currentUser.email, "settings", "custom_categories");
                const catSnap = await getDoc(catRef);
                if (catSnap.exists() && catSnap.data().map) customCategoriesMap = catSnap.data().map;
            } catch(e) { console.log(e); }
        }

        // ================= GMAIL SYNC & CLEANER =================
        document.getElementById('btn-sync').addEventListener('click', syncGmail);

        async function syncGmail() {
            if(!accessToken) return;
            showSync(true);

            try {
                const listRes = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages?maxResults=40', { headers: { Authorization: `Bearer ${accessToken}` } });
                const listData = await listRes.json();
                if (!listRes.ok || !listData.messages) { showSync(false); return; }

                for (let msg of listData.messages) {
                    const docRef = doc(db, "users", currentUser.email, "emails", msg.id);
                    const docSnap = await getDoc(docRef);
                    if (!docSnap.exists()) {
                        const detailRes = await fetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${msg.id}`, { headers: { Authorization: `Bearer ${accessToken}` } });
                        const detailData = await detailRes.json();
                        if (!detailRes.ok) continue;

                        const parsedEmail = parseGmailMessage(detailData);
                        parsedEmail.category = categorizeEmail(parsedEmail);
                        await setDoc(docRef, parsedEmail);
                    }
                }
                await loadEmailsFromFirestore();
            } catch(e) {}
            showSync(false);
        }

        // ✨ HTML & TEXT CLEANER (FIXED CODING/SYMBOLS ISSUE) ✨
        function cleanEmailContent(rawText) {
            if(!rawText) return "No text content.";
            
            // 1. Convert HTML to plain text safely
            let text = rawText;
            if(text.includes('<html') || text.includes('<!DOCTYPE') || text.includes('<body')) {
                const doc = new DOMParser().parseFromString(text, 'text/html');
                text = doc.body.textContent || doc.body.innerText || "";
            }

            // 2. Remove CSS/Style blocks and giant tracking links
            text = text.replace(/<style[^>]*>[\s\S]*?<\/style>/gi, '');
            text = text.replace(/\{[\s\S]*?\}/g, ''); // Remove CSS properties
            text = text.replace(/https?:\/\/[^\s]+/g, '[Link Removed for Readability]');
            
            // 3. Clean up white spaces
            text = text.replace(/\n{3,}/g, '\n\n').trim();
            return text || "No readable content found.";
        }

        function parseGmailMessage(message) {
            let subject = "(No Subject)";
            let sender = "(Unknown Sender)";
            let dateStr = new Date().toISOString();

            if (message.payload && message.payload.headers) {
                message.payload.headers.forEach(h => {
                    if (h.name.toLowerCase() === 'subject') subject = h.value;
                    if (h.name.toLowerCase() === 'from') sender = h.value;
                    if (h.name.toLowerCase() === 'date') dateStr = h.value;
                });
            }

            let body = "";
            // Try to find Plain Text first, then HTML
            let part = message.payload.parts ? message.payload.parts.find(p => p.mimeType === 'text/plain') : null;
            if(!part && message.payload.parts) part = message.payload.parts.find(p => p.mimeType === 'text/html');
            if(!part && message.payload.parts && message.payload.parts[0]?.parts) {
                part = message.payload.parts[0].parts.find(p => p.mimeType === 'text/plain') || message.payload.parts[0].parts.find(p => p.mimeType === 'text/html');
            }

            if (part && part.body && part.body.data) {
                body = decodeBase64(part.body.data);
            } else if (message.payload.body && message.payload.body.data) {
                body = decodeBase64(message.payload.body.data);
            }

            // Apply Cleaner
            body = cleanEmailContent(body);

            let pureEmail = sender.toLowerCase();
            const emailMatch = sender.match(/<([^>]+)>/);
            if (emailMatch && emailMatch[1]) pureEmail = emailMatch[1].toLowerCase();

            return {
                messageId: message.id, sender: sender, pureEmail: pureEmail,
                subject: subject, body: body.substring(0, 3500), 
                timestamp: new Date(dateStr).getTime() || Date.now(), category: 'inbox'
            };
        }

        function decodeBase64(str) {
            try { return decodeURIComponent(escape(window.atob(str.replace(/-/g, '+').replace(/_/g, '/')))); } 
            catch(e) { return ""; }
        }

        function categorizeEmail(emailObj) {
            if (customCategoriesMap[emailObj.pureEmail]) return customCategoriesMap[emailObj.pureEmail];
            const textToSearch = (emailObj.subject + " " + emailObj.body).toLowerCase();
            for(let word of spamKeywords) { if(textToSearch.includes(word.toLowerCase())) return 'spam'; }
            for(let domain of companyDomains) { if(emailObj.pureEmail.includes(domain)) return 'important'; }
            return 'inbox';
        }

        // ================= RENDER LOGIC =================
        async function loadEmailsFromFirestore() {
            const q = query(collection(db, "users", currentUser.email, "emails"), orderBy("timestamp", "desc"));
            const snapshot = await getDocs(q);
            allEmails = [];
            snapshot.forEach((doc) => allEmails.push(doc.data()));
            renderUI();
        }

        document.getElementById('email-list').addEventListener('scroll', () => {
            isScrolling = true;
            clearTimeout(longPressTimer);
            setTimeout(() => isScrolling = false, 200);
        });

        function renderUI() {
            const container = document.getElementById('email-list');
            container.innerHTML = '';
            
            let headerTitle = currentTab.charAt(0).toUpperCase() + currentTab.slice(1);
            if(currentTab === 'spam') headerTitle = "Fraud Emails";
            else if(currentTab === 'folders') headerTitle = "Your Folders";
            document.getElementById('header-title').innerHTML = headerTitle;

            if (currentTab === 'folders') {
                const uniqueFolders = {};
                allEmails.forEach(e => {
                    if(!['inbox', 'important', 'spam'].includes(e.category)) uniqueFolders[e.category] = (uniqueFolders[e.category] || 0) + 1;
                });

                const foldersArr = Object.keys(uniqueFolders);
                if(foldersArr.length === 0) {
                    container.innerHTML = `<div class="text-center text-gray-500 mt-20"><i class="fa-solid fa-folder-open text-4xl mb-3"></i><p>No custom folders yet.</p><p class="text-xs mt-2">Long press an email to create a category.</p></div>`;
                    return;
                }

                foldersArr.forEach((folder, idx) => {
                    const el = document.createElement('div');
                    el.className = `glass p-5 rounded-xl flex justify-between items-center active:scale-95 transition-transform animate-fade-in`;
                    el.style.animationDelay = `${idx * 0.05}s`;
                    el.innerHTML = `
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-full bg-blue-500/20 text-blue-400 flex items-center justify-center text-xl"><i class="fa-solid fa-folder"></i></div>
                            <div class="text-lg font-bold text-gray-100 capitalize">${folder}</div>
                        </div>
                        <div class="text-sm font-semibold text-gray-400 bg-white/10 px-3 py-1 rounded-full">${uniqueFolders[folder]} Emails</div>
                    `;
                    el.addEventListener('click', () => {
                        currentTab = folder;
                        document.querySelectorAll('.nav-btn').forEach(b => { b.classList.remove('text-blue-400'); b.classList.add('text-gray-400'); });
                        document.getElementById('header-title').innerHTML = `<button onclick="document.querySelector('[data-tab=\\'folders\\']').click()" class="mr-2 text-blue-400"><i class="fa-solid fa-arrow-left"></i></button> <span class="capitalize">${folder}</span>`;
                        renderEmailsList();
                    });
                    container.appendChild(el);
                });
                return;
            }

            renderEmailsList();
        }

        function renderEmailsList() {
            const container = document.getElementById('email-list');
            let displayEmails = allEmails.filter(e => e.category === currentTab);

            displayEmails.sort((a, b) => {
                const aMarked = markedSenders.includes(a.pureEmail) ? 1 : 0;
                const bMarked = markedSenders.includes(b.pureEmail) ? 1 : 0;
                if (aMarked !== bMarked) return bMarked - aMarked;
                return b.timestamp - a.timestamp; 
            });

            if(displayEmails.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-500 mt-20"><p>No emails found here.</p></div>`;
                return;
            }

            displayEmails.forEach((email, index) => {
                const isMarked = markedSenders.includes(email.pureEmail);
                const el = document.createElement('div');
                el.className = `glass p-4 rounded-xl relative animate-fade-in flex flex-col gap-2 ${isMarked ? 'border-l-4 border-l-blue-500' : 'border-l-4 border-l-transparent'}`;
                el.style.animationDelay = `${index * 0.03}s`;
                
                const senderName = email.sender.split('<')[0].replace(/"/g, '').trim();

                el.innerHTML = `
                    <div class="flex justify-between items-start gap-2">
                        <div class="font-bold text-gray-100 flex items-center gap-2 text-sm md:text-base truncate flex-1">
                            ${isMarked ? '<i class="fa-solid fa-thumbtack text-blue-400 text-xs"></i>' : ''}
                            <span class="truncate">${senderName}</span>
                        </div>
                        <div class="text-[10px] text-gray-400 whitespace-nowrap pt-1">${new Date(email.timestamp).toLocaleDateString()}</div>
                    </div>
                    <div class="text-sm font-semibold text-gray-200 line-clamp-1">${email.subject}</div>
                    <div class="text-xs text-gray-500 line-clamp-2 leading-relaxed">${email.body}</div>
                    <div class="flex justify-end mt-1">
                        <button class="bg-blue-600/20 text-blue-400 hover:bg-blue-600/40 text-xs py-1.5 px-4 rounded-lg font-bold transition-colors btn-ai z-10">
                            <i class="fa-solid fa-sparkles mr-1"></i> AI Summary
                        </button>
                    </div>
                `;

                el.addEventListener('click', (e) => { if(!e.target.closest('.btn-ai')) openFullEmail(email); });
                el.addEventListener('touchstart', (e) => { if(!isScrolling) handleTouchStart(e, email.messageId); }, {passive: true});
                el.addEventListener('touchend', handleTouchEnd);
                el.addEventListener('mousedown', (e) => { handleTouchStart(e, email.messageId); });
                el.addEventListener('mouseup', handleTouchEnd);
                el.addEventListener('mouseleave', handleTouchEnd);
                el.querySelector('.btn-ai').addEventListener('click', (e) => { e.stopPropagation(); openSummaryModal(email); });

                container.appendChild(el);
            });
        }

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const tab = e.currentTarget.getAttribute('data-tab');
                if(!tab) return;
                currentTab = tab;
                document.querySelectorAll('.nav-btn').forEach(b => { b.classList.remove('text-blue-400'); b.classList.add('text-gray-400'); });
                e.currentTarget.classList.add('text-blue-400'); e.currentTarget.classList.remove('text-gray-400');
                renderUI();
            });
        });

        function openFullEmail(email) {
            document.getElementById('fv-subject').innerText = email.subject;
            document.getElementById('fv-sender-name').innerText = email.sender.split('<')[0].replace(/"/g, '').trim();
            document.getElementById('fv-sender-email').innerText = `<${email.pureEmail}>`;
            document.getElementById('fv-date').innerText = new Date(email.timestamp).toLocaleString();
            document.getElementById('fv-body').innerText = email.body;

            const view = document.getElementById('full-email-view');
            view.classList.remove('hidden'); view.classList.add('flex');
        }

        document.getElementById('btn-close-email').addEventListener('click', () => {
            document.getElementById('full-email-view').classList.add('hidden');
            document.getElementById('full-email-view').classList.remove('flex');
        });

        function handleTouchStart(e, msgId) {
            longPressTimer = setTimeout(() => {
                selectedEmailId = msgId;
                document.getElementById('action-modal').classList.remove('hidden');
                setTimeout(() => document.getElementById('action-box').classList.remove('scale-90', 'opacity-0'), 10);
                if(window.navigator.vibrate) window.navigator.vibrate(50); 
            }, 600); 
        }
        function handleTouchEnd() { clearTimeout(longPressTimer); }
        function closeActionModal() {
            document.getElementById('action-box').classList.add('scale-90', 'opacity-0');
            setTimeout(() => { document.getElementById('action-modal').classList.add('hidden'); selectedEmailId = null; }, 200);
        }

        document.getElementById('btn-close-actions').addEventListener('click', closeActionModal);
        document.querySelectorAll('.action-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const action = e.currentTarget.getAttribute('data-action');
                if(!selectedEmailId) return;
                
                const emailObj = allEmails.find(e => e.messageId === selectedEmailId);
                const emailRef = doc(db, "users", currentUser.email, "emails", selectedEmailId);

                if (action === 'delete') {
                    await deleteDoc(emailRef);
                    allEmails = allEmails.filter(e => e.messageId !== selectedEmailId);
                } 
                else if (action === 'mark') {
                    if (markedSenders.includes(emailObj.pureEmail)) markedSenders = markedSenders.filter(s => s !== emailObj.pureEmail);
                    else markedSenders.push(emailObj.pureEmail);
                    await setDoc(doc(db, "users", currentUser.email, "settings", "marked_senders"), { senders: markedSenders });
                }
                else if (action === 'fraud') {
                    emailObj.category = 'spam';
                    await setDoc(emailRef, emailObj);
                }
                else if (action === 'category') {
                    const catName = prompt("Enter Custom Folder Name (e.g., Shopping, Job):");
                    if(catName && catName.trim() !== "") {
                        const cleanName = catName.trim().toLowerCase();
                        customCategoriesMap[emailObj.pureEmail] = cleanName;
                        await setDoc(doc(db, "users", currentUser.email, "settings", "custom_categories"), { map: customCategoriesMap });
                        allEmails.forEach(em => { if(em.pureEmail === emailObj.pureEmail) { em.category = cleanName; setDoc(doc(db, "users", currentUser.email, "emails", em.messageId), em); } });
                    }
                }
                closeActionModal(); renderUI();
            });
        });

        // ✨ AI FALLBACK SYSTEM (USING 2 KEYS & ENDPOINTS) ✨
        async function openSummaryModal(email) {
            const modal = document.getElementById('summary-modal');
            const contentBox = document.getElementById('summary-content-box');
            const textArea = document.getElementById('ai-typing-area');
            const badge = document.getElementById('ai-model-badge');
            
            textArea.innerHTML = `<div class="flex flex-col items-center justify-center h-full gap-4 text-blue-400"><div class="loader !w-8 !h-8 border-4"></div><div class="animate-pulse font-medium">AI is reading...</div></div>`;
            badge.innerText = "Connecting...";
            modal.classList.remove('hidden');
            setTimeout(() => contentBox.classList.remove('translate-y-full'), 10);

            let summaryText = "";
            let usedModelName = "";

            try {
                // TRY PRIMARY KEY (2.5 Flash)
                usedModelName = "2.5-Flash";
                summaryText = await callGeminiAPI("gemini-2.5-flash", PRIMARY_GEMINI_API_KEY, email.body);
            } catch (err1) {
                console.log("Primary AI Failed, Switching to Fallback...", err1);
                try {
                    // TRY FALLBACK KEY (3.1 Pro Preview)
                    usedModelName = "3.1-Pro";
                    summaryText = await callGeminiAPI("gemini-3.1-pro-preview", FALLBACK_GEMINI_API_KEY, email.body);
                } catch (err2) {
                    console.log("Fallback AI also failed.", err2);
                    usedModelName = "Error";
                    summaryText = "❌ Failed to generate summary. Both AI models are temporarily unavailable or API keys have reached their limit.";
                }
            }

            badge.innerText = `Model: ${usedModelName}`;
            typeText(textArea, summaryText);
        }

        async function callGeminiAPI(model, apiKey, textContent) {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: `Summarize this email clearly in exactly 3 short bullet points:\n\n${textContent}` }] }] })
            });
            const data = await res.json();
            if(!res.ok || data.error) throw new Error(data.error?.message || "Unknown API Error");
            return data.candidates[0].content.parts[0].text;
        }

        function typeText(element, text) {
            element.innerHTML = '';
            let i = 0;
            const formattedText = text.replace(/\*/g, '').replace(/\n/g, '<br>');

            function typeWriter() {
                if (i < formattedText.length) {
                    if(formattedText.charAt(i) === '<') {
                        let tag = "";
                        while(formattedText.charAt(i) !== '>' && i < formattedText.length){ tag += formattedText.charAt(i); i++; }
                        tag += '>'; element.innerHTML += tag; i++;
                    } else { element.innerHTML += formattedText.charAt(i); i++; }
                    element.scrollTop = element.scrollHeight; 
                    setTimeout(typeWriter, 15);
                } else { element.innerHTML += '<span class="cursor-blink font-bold text-blue-500 ml-1">|</span>'; }
            }
            typeWriter();
        }

        document.getElementById('btn-close-summary').addEventListener('click', () => {
            document.getElementById('summary-content-box').classList.add('translate-y-full');
            setTimeout(() => document.getElementById('summary-modal').classList.add('hidden'), 300);
        });

        function showSync(show) {
            const ind = document.getElementById('sync-indicator');
            const btnIcon = document.querySelector('#btn-sync i');
            if(show) { ind.classList.remove('hidden'); ind.classList.add('flex'); btnIcon.classList.add('fa-spin'); } 
            else { ind.classList.add('hidden'); ind.classList.remove('flex'); btnIcon.classList.remove('fa-spin'); }
        }
    </script>
