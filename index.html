    <script type="module">
        // AI Summary Service को अब एक अलग फ़ाइल से इम्पोर्ट किया जाएगा
        import { getAISummary } from './ai-service.js';

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, query, orderBy, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const GOOGLE_CLIENT_ID = "30172584711-9l229pscpqpf478qvtp2ronplmbrtha0.apps.googleusercontent.com"; 
        
        // ✨ OPENROUTER API KEY - यह अब ai-service.js से भी हटा दिया गया है
        // यह कुंजी अब Vercel Serverless Function (api/ai-summary.js) द्वारा सुरक्षित रूप से मैनेज की जाएगी।

        const firebaseConfig = {
            apiKey: "AIzaSyDPVa0eYZpxYh6Q5vyhSf0IogTkedc72tG",
            authDomain: "mailtick-35818.firebaseapp.com",
            projectId: "mailtick-35818",
            storageBucket: "mailtick-35818.firebasestorage.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let accessToken = null;
        let currentUser = null;
        let currentTab = 'inbox'; 
        let allEmails = [];
        let spamKeywords = ['free offer', 'free gift', 'prize', 'urgent', 'winner', 'lottery', 'viagra', 'earn money fast', 'crypto', 'giveaway', 'claim now', 'cash prize'];
        let markedSenders = [];
        let customCategoriesMap = {}; 
        let companyDomains = ['amazon', 'paypal', 'netflix', 'bank', 'apple', 'google', 'microsoft'];
        let longPressTimer;
        let selectedEmailId = null;
        let isScrolling = false; 
        let pollingInterval = null;

        // ================= SESSION PERSISTENCE =================
        window.onload = () => {
            const savedUser = localStorage.getItem('mailtick_user');
            if(savedUser) {
                currentUser = JSON.parse(savedUser);
                document.getElementById('user-email-display').innerText = currentUser.email;
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                document.getElementById('app-screen').classList.add('flex');
                initApp(false); 
                checkNotificationPermissionStatus(); 
            }

            google.accounts.oauth2.initTokenClient({
                client_id: GOOGLE_CLIENT_ID,
                scope: 'https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/gmail.readonly',
                callback: handleCredentialResponse,
            });

            document.getElementById("btn-login").addEventListener("click", () => {
                google.accounts.oauth2.initTokenClient({
                    client_id: GOOGLE_CLIENT_ID,
                    scope: 'https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/gmail.readonly',
                    callback: handleCredentialResponse,
                }).requestAccessToken();
            });
        };

        async function handleCredentialResponse(response) {
            if (response && response.access_token) {
                accessToken = response.access_token;
                try {
                    const profileRes = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: `Bearer ${accessToken}` } });
                    const profile = await profileRes.json();
                    
                    currentUser = { email: profile.email };
                    localStorage.setItem('mailtick_user', JSON.stringify(currentUser)); 
                    
                    document.getElementById('user-email-display').innerText = currentUser.email;
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('app-screen').classList.remove('hidden');
                    document.getElementById('app-screen').classList.add('flex');
                    initApp(true); 
                    requestNotificationPermission();
                } catch(e) { alert("Login failed."); }
            }
        }

        async function initApp(shouldSync) {
            await loadUserSettings();
            await loadEmailsFromFirestore();
            if(shouldSync) syncGmail(); 
            
            if(pollingInterval) clearInterval(pollingInterval);
            pollingInterval = setInterval(checkNewEmailsBackground, 30000); 
        }

        async function loadUserSettings() {
            try {
                const markSnap = await getDoc(doc(db, "users", currentUser.email, "settings", "marked_senders"));
                if (markSnap.exists() && markSnap.data().senders) markedSenders = markSnap.data().senders;

                const catSnap = await getDoc(doc(db, "users", currentUser.email, "settings", "custom_categories"));
                if (catSnap.exists() && catSnap.data().map) customCategoriesMap = catSnap.data().map;
            } catch(e) {}
        }

        // ================= NOTIFICATION ENGINE =================
        function checkNotificationPermissionStatus() {
            if ("Notification" in window) {
                if (Notification.permission === "default" || Notification.permission === "denied") {
                    document.getElementById('btn-notify-req').classList.remove('hidden');
                    document.getElementById('btn-notify-req').classList.add('flex');
                } else {
                    document.getElementById('btn-notify-req').classList.add('hidden');
                }
            }
        }

        document.getElementById('btn-notify-req').addEventListener('click', requestNotificationPermission);

        function requestNotificationPermission() {
            if ("Notification" in window) {
                Notification.requestPermission().then(() => checkNotificationPermissionStatus());
            }
        }

        async function checkNewEmailsBackground() {
            if(!accessToken || !currentUser) return;
            try {
                const listRes = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages?maxResults=3', { headers: { Authorization: `Bearer ${accessToken}` } });
                const listData = await listRes.json();
                if (!listData.messages) return;

                let hasNewEmail = false;
                for (let msg of listData.messages) {
                    const docRef = doc(db, "users", currentUser.email, "emails", msg.id);
                    const docSnap = await getDoc(docRef);
                    
                    if (!docSnap.exists()) {
                        hasNewEmail = true;
                        const detailRes = await fetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${msg.id}`, { headers: { Authorization: `Bearer ${accessToken}` } });
                        const detailData = await detailRes.json();
                        
                        const parsedEmail = parseGmailMessage(detailData);
                        parsedEmail.category = categorizeEmail(parsedEmail);
                        await setDoc(docRef, parsedEmail);

                        if ("Notification" in window && Notification.permission === "granted") {
                            const showName = parsedEmail.sender.split('<')[0].replace(/"/g, '').trim() || "New Sender";
                            new Notification(`Mailtick: New Email`, {
                                body: `${showName}: ${parsedEmail.subject}`,
                                icon: "https://www.svgrepo.com/show/475656/google-color.svg"
                            });
                        }
                    }
                }
                if(hasNewEmail) {
                    await loadEmailsFromFirestore();
                }
            } catch(e) {}
        }

        document.getElementById('btn-sync').addEventListener('click', () => {
            if(!accessToken) {
                google.accounts.oauth2.initTokenClient({
                    client_id: GOOGLE_CLIENT_ID,
                    scope: 'https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/gmail.readonly',
                    callback: handleCredentialResponse,
                }).requestAccessToken();
                return;
            }
            syncGmail();
        });

        async function syncGmail() {
            showSync(true);
            try {
                const listRes = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages?maxResults=40', { headers: { Authorization: `Bearer ${accessToken}` } });
                const listData = await listRes.json();
                if (!listRes.ok || !listData.messages) { showSync(false); return; }

                for (let msg of listData.messages) {
                    const docRef = doc(db, "users", currentUser.email, "emails", msg.id);
                    const docSnap = await getDoc(docRef);
                    if (!docSnap.exists()) {
                        const detailRes = await fetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${msg.id}`, { headers: { Authorization: `Bearer ${accessToken}` } });
                        const detailData = await detailRes.json();
                        if (!detailRes.ok) continue;

                        const parsedEmail = parseGmailMessage(detailData);
                        parsedEmail.category = categorizeEmail(parsedEmail);
                        await setDoc(docRef, parsedEmail);
                    }
                }
                await loadEmailsFromFirestore();
            } catch(e) {}
            showSync(false);
        }

        // ================= PERFECT UTF-8 DECODER (FIXES ALL BLANK EMAILS & EMOJIS) =================
        function b64DecodeUnicode(str) {
            if (!str) return "";
            try {
                // Fix Base64Url format
                str = str.replace(/-/g, '+').replace(/_/g, '/');
                // Fix Padding
                const pad = str.length % 4;
                if(pad) {
                    if(pad === 1) str += 'A=='; // Fallback for weird Gmail cutoffs
                    else str += new Array(5 - pad).join('=');
                }
                
                // Magic: TextDecoder ensures complex emojis and tables don't crash
                const binary = atob(str);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }
                return new TextDecoder('utf-8').decode(bytes);
            } catch (e) {
                try { return atob(str); } catch(err) { return ""; }
            }
        }

        function extractDeepBody(payload) {
            let htmlBody = "";
            let plainBody = "";
            
            // Recursive deep search function
            function searchParts(parts) {
                for (let part of parts) {
                    if (part.mimeType === "text/html" && part.body && part.body.data) {
                        htmlBody = b64DecodeUnicode(part.body.data);
                    } else if (part.mimeType === "text/plain" && part.body && part.body.data) {
                        plainBody = b64DecodeUnicode(part.body.data);
                    }
                    if (part.parts) {
                        searchParts(part.parts); // Keep digging for Swiggy/Insta hidden emails
                    }
                }
            }
            
            if (payload.parts) searchParts(payload.parts);
            else if (payload.body && payload.body.data) {
                if (payload.mimeType === "text/html") htmlBody = b64DecodeUnicode(payload.body.data);
                else plainBody = b64DecodeUnicode(payload.body.data);
            }
            return { htmlBody, plainBody };
        }

        function parseGmailMessage(message) {
            let subject = "(No Subject)";
            let sender = "(Unknown Sender)";
            let dateStr = new Date().toISOString();

            if (message.payload && message.payload.headers) {
                message.payload.headers.forEach(h => {
                    if (h.name.toLowerCase() === 'subject') subject = h.value;
                    if (h.name.toLowerCase() === 'from') sender = h.value;
                    if (h.name.toLowerCase() === 'date') dateStr = h.value;
                });
            }

            let { htmlBody, plainBody } = extractDeepBody(message.payload);

            if (!plainBody && htmlBody) {
                try {
                    let doc = new DOMParser().parseFromString(htmlBody, 'text/html');
                    plainBody = doc.body.innerText || "";
                } catch(e){}
            }

            // Clean Sender
            let pureEmail = sender.toLowerCase();
            const emailMatch = sender.match(/<([^>]+)>/);
            if (emailMatch && emailMatch[1]) pureEmail = emailMatch[1].toLowerCase();

            // Make sure HTML links open in new tab and don't break iframe
            if(htmlBody) {
                if (!htmlBody.includes("<base target=")) {
                    htmlBody = `<base target="_blank">\n` + htmlBody;
                }
            }

            return {
                messageId: message.id, 
                sender: sender, 
                pureEmail: pureEmail,
                subject: subject, 
                body: plainBody.substring(0, 3000).trim(), 
                htmlBody: htmlBody || "", 
                timestamp: new Date(dateStr).getTime() || Date.now(), 
                category: 'inbox'
            };
        }

        function categorizeEmail(emailObj) {
            if (customCategoriesMap[emailObj.pureEmail]) return customCategoriesMap[emailObj.pureEmail];
            const textToSearch = (emailObj.subject + " " + emailObj.body).toLowerCase();
            for(let word of spamKeywords) { if(textToSearch.includes(word.toLowerCase())) return 'spam'; }
            for(let domain of companyDomains) { if(emailObj.pureEmail.includes(domain)) return 'important'; }
            return 'inbox';
        }

        // ================= RENDER LOGIC =================
        async function loadEmailsFromFirestore() {
            const q = query(collection(db, "users", currentUser.email, "emails"), orderBy("timestamp", "desc"));
            const snapshot = await getDocs(q);
            allEmails = [];
            snapshot.forEach((doc) => allEmails.push(doc.data()));
            renderUI();
        }

        document.getElementById('email-list').addEventListener('scroll', () => {
            isScrolling = true;
            clearTimeout(longPressTimer);
            setTimeout(() => isScrolling = false, 200);
        });

        function renderUI() {
            const container = document.getElementById('email-list');
            container.innerHTML = '';
            
            let headerTitle = currentTab.charAt(0).toUpperCase() + currentTab.slice(1);
            if(currentTab === 'spam') headerTitle = "Fraud Emails";
            else if(currentTab === 'folders') headerTitle = "Your Folders";
            
            if (currentTab === 'folders') {
                document.getElementById('header-title').innerHTML = headerTitle;
                const uniqueFolders = {};
                allEmails.forEach(e => {
                    if(!['inbox', 'important', 'spam'].includes(e.category)) uniqueFolders[e.category] = (uniqueFolders[e.category] || 0) + 1;
                });

                const foldersArr = Object.keys(uniqueFolders);
                if(foldersArr.length === 0) {
                    container.innerHTML = `<div class="text-center text-gray-400 mt-20"><i class="fa-solid fa-folder-open text-4xl mb-3 text-gray-300"></i><p>No custom folders yet.</p></div>`;
                    return;
                }

                foldersArr.forEach((folder, idx) => {
                    const el = document.createElement('div');
                    el.className = `card-light p-4 flex justify-between items-center active:scale-95 transition-transform animate-fade-in mb-3 cursor-pointer`;
                    el.style.animationDelay = `${idx * 0.05}s`;
                    el.innerHTML = `
                        <div class="flex items-center gap-4"><div class="w-10 h-10 rounded-full bg-indigo-50 text-indigo-500 flex items-center justify-center"><i class="fa-solid fa-folder"></i></div><div class="text-base font-bold text-gray-800 capitalize">${folder}</div></div>
                        <div class="text-xs font-bold text-indigo-500 bg-indigo-50 px-3 py-1.5 rounded-full">${uniqueFolders[folder]} Emails</div>
                    `;
                    el.addEventListener('click', () => {
                        currentTab = folder;
                        document.getElementById('header-title').innerHTML = `<button onclick="document.querySelector('[data-tab=\\'folders\\']').click()" class="mr-3 text-blue-600 hover:text-blue-800"><i class="fa-solid fa-arrow-left"></i></button><span class="capitalize">${folder}</span>`;
                        renderEmailsList();
                    });
                    container.appendChild(el);
                });
                return;
            }

            document.getElementById('header-title').innerHTML = headerTitle;
            renderEmailsList();
        }

        function renderEmailsList() {
            const container = document.getElementById('email-list');
            container.innerHTML = '';
            let displayEmails = allEmails.filter(e => e.category === currentTab);

            displayEmails.sort((a, b) => {
                const aMarked = markedSenders.includes(a.pureEmail) ? 1 : 0;
                const bMarked = markedSenders.includes(b.pureEmail) ? 1 : 0;
                if (aMarked !== bMarked) return bMarked - aMarked;
                return b.timestamp - a.timestamp; 
            });

            if(displayEmails.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-400 mt-20"><p>No emails found.</p></div>`;
                return;
            }

            const colors = ['bg-blue-100 text-blue-600', 'bg-green-100 text-green-600', 'bg-purple-100 text-purple-600', 'bg-orange-100 text-orange-600', 'bg-pink-100 text-pink-600'];

            displayEmails.forEach((email, index) => {
                const isMarked = markedSenders.includes(email.pureEmail);
                
                const senderNameStr = email.sender ? email.sender.split('<')[0].replace(/"/g, '').trim() : "Unknown";
                const initial = senderNameStr ? senderNameStr.charAt(0).toUpperCase() : "M";
                const colorClass = colors[senderNameStr.length % colors.length];

                const el = document.createElement('div');
                el.className = `card-light p-4 relative animate-fade-in flex gap-3 mb-3 ${isMarked ? 'border-l-4 border-l-blue-500' : ''}`;
                el.style.animationDelay = `${index * 0.03}s`;

                el.innerHTML = `
                    <div class="w-10 h-10 rounded-full ${colorClass} flex items-center justify-center font-bold text-lg flex-shrink-0 mt-0.5">${initial}</div>
                    <div class="flex-1 min-w-0 flex flex-col justify-center">
                        <div class="flex justify-between items-start gap-2">
                            <div class="font-bold text-gray-900 text-sm truncate flex-1">
                                ${isMarked ? '<i class="fa-solid fa-thumbtack text-blue-500 text-xs mr-1"></i>' : ''}
                                ${senderNameStr}
                            </div>
                            <div class="text-[10px] text-gray-400 font-medium whitespace-nowrap pt-0.5">${new Date(email.timestamp).toLocaleDateString()}</div>
                        </div>
                        <div class="text-sm font-medium text-gray-600 line-clamp-1 mt-0.5">${email.subject}</div>
                        <div class="flex justify-end mt-2">
                            <button class="btn-ai-solid text-[11px] py-1.5 px-3 rounded-full font-bold transition-transform active:scale-95 btn-ai z-10">
                                <i class="fa-solid fa-sparkles mr-1"></i> AI Summary
                            </button>
                        </div>
                    </div>
                `;

                el.addEventListener('click', (e) => { if(!e.target.closest('.btn-ai')) openFullEmail(email, senderNameStr, initial, colorClass); });
                el.addEventListener('touchstart', (e) => { if(!isScrolling) handleTouchStart(e, email.messageId); }, {passive: true});
                el.addEventListener('touchend', handleTouchEnd);
                el.addEventListener('mousedown', (e) => { handleTouchStart(e, email.messageId); });
                el.addEventListener('mouseup', handleTouchEnd);
                el.addEventListener('mouseleave', handleTouchEnd);
                el.querySelector('.btn-ai').addEventListener('click', (e) => { e.stopPropagation(); openSummaryModal(email); });

                container.appendChild(el);
            });
        }

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const tab = e.currentTarget.getAttribute('data-tab');
                if(!tab) return;
                currentTab = tab;
                document.querySelectorAll('.nav-btn').forEach(b => { b.classList.remove('text-blue-600'); b.classList.add('text-gray-400'); });
                e.currentTarget.classList.add('text-blue-600'); e.currentTarget.classList.remove('text-gray-400');
                renderUI();
            });
        });

        function openFullEmail(email, senderNameStr, initial, colorClass) {
            document.getElementById('fv-subject').innerText = email.subject;
            document.getElementById('fv-sender-name').innerText = senderNameStr;
            document.getElementById('fv-sender-email').innerText = `<${email.pureEmail}>`;
            document.getElementById('fv-date').innerText = new Date(email.timestamp).toLocaleString();
            
            const avatarDiv = document.getElementById('fv-avatar');
            avatarDiv.className = `w-10 h-10 rounded-full flex items-center justify-center font-bold text-lg flex-shrink-0 ${colorClass}`;
            avatarDiv.innerText = initial;

            const iframe = document.getElementById('fv-iframe');
            
            let displayContent = email.htmlBody;
            if(!displayContent || displayContent.trim() === "") {
                displayContent = `<div style="font-family: sans-serif; padding: 20px; font-size: 15px; color: #333; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word;">${(email.body || "").replace(/\n/g, '<br>')}</div>`;
            }
            
            iframe.contentWindow.document.open();
            iframe.contentWindow.document.write(displayContent);
            iframe.contentWindow.document.close();

            const view = document.getElementById('full-email-view');
            view.classList.remove('hidden'); view.classList.add('flex');
        }

        document.getElementById('btn-close-email').addEventListener('click', () => {
            document.getElementById('full-email-view').classList.add('hidden');
            document.getElementById('full-email-view').classList.remove('flex');
            document.getElementById('fv-iframe').contentWindow.document.open();
            document.getElementById('fv-iframe').contentWindow.document.write("");
            document.getElementById('fv-iframe').contentWindow.document.close();
        });

        function handleTouchStart(e, msgId) {
            longPressTimer = setTimeout(() => {
                selectedEmailId = msgId;
                document.getElementById('action-modal').classList.remove('hidden');
                setTimeout(() => document.getElementById('action-box').classList.remove('scale-90', 'opacity-0'), 10);
                if(window.navigator.vibrate) window.navigator.vibrate(50); 
            }, 600); 
        }
        function handleTouchEnd() { clearTimeout(longPressTimer); }
        function closeActionModal() {
            document.getElementById('action-box').classList.add('scale-90', 'opacity-0');
            setTimeout(() => { document.getElementById('action-modal').classList.add('hidden'); selectedEmailId = null; }, 200);
        }

        document.getElementById('btn-close-actions').addEventListener('click', closeActionModal);
        document.querySelectorAll('.action-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const action = e.currentTarget.getAttribute('data-action');
                if(!selectedEmailId) return;
                const emailObj = allEmails.find(e => e.messageId === selectedEmailId);
                const emailRef = doc(db, "users", currentUser.email, "emails", selectedEmailId);

                if (action === 'delete') {
                    await deleteDoc(emailRef);
                    allEmails = allEmails.filter(e => e.messageId !== selectedEmailId);
                } 
                else if (action === 'mark') {
                    if (markedSenders.includes(emailObj.pureEmail)) markedSenders = markedSenders.filter(s => s !== emailObj.pureEmail);
                    else markedSenders.push(emailObj.pureEmail);
                    await setDoc(doc(db, "users", currentUser.email, "settings", "marked_senders"), { senders: markedSenders });
                }
                else if (action === 'fraud') {
                    emailObj.category = 'spam';
                    await setDoc(emailRef, emailObj);
                }
                else if (action === 'category') {
                    const catName = prompt("Enter Custom Folder Name:");
                    if(catName && catName.trim() !== "") {
                        const cleanName = catName.trim().toLowerCase();
                        customCategoriesMap[emailObj.pureEmail] = cleanName;
                        await setDoc(doc(db, "users", currentUser.email, "settings", "custom_categories"), { map: customCategoriesMap });
                        allEmails.forEach(em => { if(em.pureEmail === emailObj.pureEmail) { em.category = cleanName; setDoc(doc(db, "users", currentUser.email, "emails", em.messageId), em); } });
                    }
                }
                closeActionModal(); renderUI();
            });
        });

        // ✨ AI SUMMARY ENGINE ✨
        // AI summary API कॉल का मुख्य लॉजिक अब ai-service.js के माध्यम से एक Vercel Serverless Function को कॉल करता है।
        async function openSummaryModal(email) {
            const modal = document.getElementById('summary-modal');
            const contentBox = document.getElementById('summary-content-box');
            const textArea = document.getElementById('ai-typing-area');
            const badge = document.getElementById('ai-model-badge');
            
            textArea.innerHTML = `<div class="flex flex-col items-center justify-center h-full gap-4 text-blue-600"><div class="loader !w-8 !h-8 border-4"></div><div class="animate-pulse font-bold">AI is reading...</div></div>`;
            badge.innerText = "Connecting...";
            modal.classList.remove('hidden');
            setTimeout(() => contentBox.classList.remove('translate-y-full'), 10);

            // बाहरी AI सेवा फ़ंक्शन को कॉल करें
            const summaryText = await getAISummary(email.body);
            
            // मॉडल का नाम सर्वरलेस फ़ंक्शन से आना चाहिए, या यहाँ तय किया जा सकता है
            badge.innerText = "gpt-oss-120b:free"; 
            typeText(textArea, summaryText);
        }

        function typeText(element, text) {
            element.innerHTML = '';
            let i = 0;
            const formattedText = text.replace(/\*/g, '').replace(/\n/g, '<br>');

            function typeWriter() {
                if (i < formattedText.length) {
                    if(formattedText.charAt(i) === '<') {
                        let tag = "";
                        while(formattedText.charAt(i) !== '>' && i < formattedText.length){ tag += formattedText.charAt(i); i++; }
                        tag += '>'; element.innerHTML += tag; i++;
                    } else { element.innerHTML += formattedText.charAt(i); i++; }
                    element.scrollTop = element.scrollHeight; 
                    setTimeout(typeWriter, 10);
                } else { element.innerHTML += '<span class="cursor-blink font-bold text-blue-500 ml-1">|</span>'; }
            }
            typeWriter();
        }

        document.getElementById('btn-close-summary').addEventListener('click', () => {
            document.getElementById('summary-content-box').classList.add('translate-y-full');
            setTimeout(() => document.getElementById('summary-modal').classList.add('hidden'), 300);
        });

        function showSync(show) {
            const ind = document.getElementById('sync-indicator');
            const btnIcon = document.querySelector('#btn-sync i');
            if(show) { ind.classList.remove('hidden'); ind.classList.add('flex'); btnIcon.classList.add('fa-spin'); } 
            else { ind.classList.add('hidden'); ind.classList.remove('flex'); btnIcon.classList.remove('fa-spin'); }
        }
    </script>
</body>
</html>
